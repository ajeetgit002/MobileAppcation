################################################################################
# Staging Environment Configuration
# Load with: mvn clean test -Denv=staging
################################################################################

env=staging

# APPIUM SERVER - Staging
appium.server.url=http://staging-appium-server:4723
appium.server.timeout=45

# ANDROID - Staging
platform=ANDROID
automation.name=UiAutomator2
platform.version=13
device.name=staging-device-1
device.udid=staging-device-id-1

# APP - Staging
app.path=./app/staging/app-staging.apk
app.package=com.example.app.staging
app.activity=.MainActivity

# TIMEOUTS - Staging
implicit.wait=15
explicit.wait=20
page.load.timeout=30

# LOGGING - Staging
log.level=INFO
log.dir=./logs/staging

# TEST EXECUTION - Staging
thread.count=3
parallel.mode=true
