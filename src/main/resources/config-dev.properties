################################################################################
# Development Environment Configuration
# Load with: mvn clean test -Denv=dev
################################################################################

env=dev

# APPIUM SERVER - Development
appium.server.url=http://localhost:4723
appium.server.timeout=30

# ANDROID - Development
platform=ANDROID
automation.name=UiAutomator2
platform.version=13
device.name=emulator-5554
device.udid=emulator-5554

# APP - Development
app.path=./app/debug/app-debug.apk
app.package=com.example.app
app.activity=.MainActivity

# TIMEOUTS - Development
implicit.wait=10
explicit.wait=15
page.load.timeout=20

# LOGGING - Development
log.level=DEBUG
log.dir=./logs/dev

# TEST EXECUTION - Development
thread.count=1
parallel.mode=false
