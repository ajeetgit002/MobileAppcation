################################################################################
# Production Environment Configuration
# Load with: mvn clean test -Denv=prod
################################################################################

env=prod

# APPIUM SERVER - Production
appium.server.url=http://prod-appium-server:4723
appium.server.timeout=60

# ANDROID - Production
platform=ANDROID
automation.name=UiAutomator2
platform.version=13
device.name=prod-device-1
device.udid=prod-device-id-1

# APP - Production
app.path=./app/release/app-release.apk
app.package=com.example.app.prod
app.activity=.MainActivity

# TIMEOUTS - Production
implicit.wait=20
explicit.wait=25
page.load.timeout=40

# LOGGING - Production
log.level=WARN
log.dir=./logs/prod

# TEST EXECUTION - Production
thread.count=5
parallel.mode=true
