################################################################################
# Appium Automation Framework - Configuration Properties
# Supports multiple environments: dev, staging, prod
# Load environment-specific config by setting: -Denv=dev (or staging/prod)
################################################################################

# Default environment (can be overridden via Maven -Denv property)
env=dev

################################################################################
# APPIUM SERVER CONFIGURATION
################################################################################
appium.server.url=http://localhost:4723
appium.server.timeout=30

################################################################################
# ANDROID PLATFORM CONFIGURATION
################################################################################
# Platform
platform=ANDROID
automation.name=UiAutomator2
platform.version=13

# Device Configuration
device.name=emulator-5554
device.udid=emulator-5554

# App Configuration
app.path=/path/to/app.apk
app.package=com.example.app
app.activity=.MainActivity

# Appium Capabilities
implicit.wait=10
explicit.wait=15
page.load.timeout=20

################################################################################
# LOGGING CONFIGURATION
################################################################################
log.level=INFO
log.dir=./logs

################################################################################
# TEST EXECUTION CONFIGURATION
################################################################################
thread.count=1
parallel.mode=false

################################################################################
# ENVIRONMENT-SPECIFIC OVERRIDES
# These are placeholder sections that will be used by environment configs
################################################################################
# Dev Environment - overrides above if env=dev
# Staging Environment - overrides above if env=staging
# Prod Environment - overrides above if env=prod
